name: Daily Sync

on:
  schedule:
    # 每天北京时间 06:00 (UTC 22:00) 执行
    - cron: '0 22 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Timezone
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S CST')" >> $GITHUB_ENV

      - name: Update Last Updated Timestamp
        run: |
          # 更新 README 中的最后更新时间
          sed -i "s/最后更新时间见徽章/最后更新: ${{ env.CURRENT_TIME }}/" README.md || true
          sed -i "s/automatically updated daily/Automatically updated: ${{ env.CURRENT_TIME }}/" README_EN.md || true

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Daily sync: ${{ env.CURRENT_TIME }}"
            git push
          fi

      - name: Keep Workflow Alive
        uses: actions/github-script@v7
        with:
          script: |
            // GitHub 会自动禁用 60 天未活动的 scheduled workflows
            // 此步骤确保 workflow 保持活跃
            console.log('Workflow kept alive');
