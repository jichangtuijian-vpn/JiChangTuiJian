name: Update Badges

on:
  schedule:
    # 每 30 分钟更新一次
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Timezone
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S CST')" >> $GITHUB_ENV

      - name: Update Timestamp in README
        run: |
          # 在 README 中更新时间戳标记
          if grep -q "LAST_UPDATED" README.md; then
            sed -i "s/<!-- LAST_UPDATED -->.*<!-- \/LAST_UPDATED -->/<!-- LAST_UPDATED -->${{ env.CURRENT_TIME }}<!-- \/LAST_UPDATED -->/" README.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "⏰ Update timestamp: ${{ env.CURRENT_TIME }}"
            git push
          fi
